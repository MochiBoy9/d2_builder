<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Destiny Build Maker</title>
<meta name="description" content="A local Destiny 2 loadout workbench: every subclass, weapon, armor piece and mod, with a full Armor 3.0 stat calculator.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0B0C">

<!-- Destiny 2's interface is set in Neue Haas Grotesk Display Pro, which is
     licensed and cannot ship here. tokens.css prefers it when it is installed
     locally or dropped into assets/fonts/ (see assets/fonts/README.md), and
     falls back to Inter — the closest freely available neo-grotesque — with
     Archivo carrying the variable width axis the tracked HUD labels use. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@100..900&display=swap">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/app.css">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230B0B0C'/%3E%3Cpath fill='%23D9AE4A' d='M12 3 3 21h18L12 3Zm0 4.2 5.7 11.4H6.3L12 7.2Z'/%3E%3C/svg%3E">
</head>
<body>

<div id="app"></div>

<noscript>
  <div style="max-width:52ch;margin:12vh auto;padding:24px;border:1px solid rgba(233,229,219,.15);color:#E7E3D9;font:15px/1.6 system-ui,sans-serif;background:#151517">
    <strong style="display:block;font-size:19px;margin-bottom:8px">JavaScript is switched off</strong>
    This build maker is entirely client-side — it needs JavaScript to run, and it
    never sends your builds anywhere. Enable JavaScript for this page and reload.
  </div>
</noscript>

<!-- core -->
<script src="assets/js/core/util.js"></script>

<!-- data -->
<script src="assets/js/data/game.js"></script>
<script src="assets/js/data/subclasses.js"></script>
<script src="assets/js/data/weapon-perks.js"></script>
<script src="assets/js/data/weapons.js"></script>
<script src="assets/js/data/weapon-rolls.js"></script>
<script src="assets/js/data/armor.js"></script>
<script src="assets/js/data/mods.js"></script>

<!-- engine -->
<script src="assets/js/core/icons.js"></script>
<script src="assets/js/core/build.js"></script>
<script src="assets/js/core/store.js"></script>
<script src="assets/js/core/level.js"></script>
<script src="assets/js/core/presets.js"></script>
<script src="assets/js/core/manifest.js"></script>

<!-- ui -->
<script src="assets/js/ui/picker.js"></script>
<script src="assets/js/ui/shell.js"></script>
<script src="assets/js/ui/builder.js"></script>
<script src="assets/js/ui/statbar.js"></script>
<script src="assets/js/ui/library.js"></script>
<script src="assets/js/ui/compare.js"></script>

<script src="assets/js/app.js"></script>
</body>
</html>
